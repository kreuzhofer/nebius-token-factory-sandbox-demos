name: Code quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development tools
        run: |
          python -m venv examples/python/.venv
          examples/python/.venv/bin/python -m pip install -r examples/python/requirements-dev.txt
      - name: Formatting, lint, file checks, and tests
        run: examples/python/.venv/bin/pre-commit run --all-files --show-diff-on-failure
