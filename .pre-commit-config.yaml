minimum_pre_commit_version: "4.6.2"
default_language_version:
  python: python3.12
exclude: ^(\.agents|\.codex|\.scratch)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--config, examples/python/pyproject.toml, --fix]
      - id: ruff-format
        args: [--config, examples/python/pyproject.toml]
  - repo: local
    hooks:
      - id: tests
        name: Python tests
        entry: examples/python/.venv/bin/python -m unittest discover -s examples/python -t examples/python -q
        language: system
        pass_filenames: false
        always_run: true
